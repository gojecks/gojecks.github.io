<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="jEliDb or jDB is an open source JavaScript library that provides powerful in-memory database capabilities to both browser and server applications">
    <meta name="keywords" content="HTML, JS, JavaScript, framework, noSQL, front-end, frontend, web development">
    <meta name="author" content="Joseph Gojecks Kadiri">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../css/styles.min.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="icon" href="../../css/image/favicon.png">
    <!-- these two pins are what actually run the playground; see the notice
         banner below for why they haven't been bumped -->
    <script src="https://unpkg.com/jeli@2.0.0-beta/dist/jeli.min.js" crossorigin></script>
    <script src="https://unpkg.com/jelidb@1.0.6-beta/dist/jdb.min.js" crossorigin></script>
    <title>Playground &mdash; jEliDB</title>
</head>

<body>
    <nav class="navbar navbar-inverse navbar-fixed-top" role="navigation">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="../"><span class="jdb-brand-mark"></span>jEliDB</a>
            </div>
            <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
                <ul class="nav navbar-nav navbar-right">
                    <li><a class="btn btn-link" href="../api/">API</a></li>
                    <li><a class="btn btn-link" href="../api/jql/">jQL</a></li>
                    <li class="active"><a class="btn btn-link" href="./">Playground</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="jdb-shell" style="margin-top:76px">
        <div class="alert alert-warning">
            <strong>Running a pinned build:</strong> this playground loads <code>jelidb@1.0.6-beta</code> from
            unpkg, an older release. It may not reflect the newest jQL syntax (like <code>--flag=value</code>)
            covered in the <a href="../api/jql/">jQL reference</a> &mdash; treat it as a general feel for jDB, not
            a spec of the latest behavior.
        </div>
    </div>

    <app-root>
        <template>
            <div class="jdb-shell jdb-main">
                <div class="row">
                    <div class="col-lg-12">
                        <h3 class="page-header">Playground
                            <small class="pull-right" :if="activeDb">{%dbName%} &middot; version {%dbVersion%}
                                <a class="btn btn-link" @click="$disconnect()">Disconnect</a></small>
                        </h3>
                    </div>
                </div>
                <div class="row" :if="!activeDb">
                    <div class="col-md-4"></div>
                    <div class="col-md-4">
                        <div class="panel panel-default">
                            <div class="panel-heading">Create / open a database</div>
                            <div class="panel-body">
                                <div class="form-group">
                                    <input type="text" placeholder="Database name" :model="db.name" class="form-control">
                                </div>
                                <div class="form-group">
                                    <input type="text" placeholder="Version" :model="db.version" class="form-control">
                                </div>
                                <div class="pull-right"><button @click="$create()" class="btn btn-jdb-primary">Create / Open</button></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4"></div>
                </div>
                <div :if="activeDb">
                    <div class="row">
                        <div class="col-xs-3">
                            <div class="panel panel-default" :for="tbl in tables">
                                <div class="panel-heading">Search {%tbl.name%}</div>
                                <div class="panel-body">
                                    <div class="form-group">
                                        <input type="text" placeholder="Search table" :model="queryString" class="form-control">
                                    </div>
                                    <div><button @click="searchTable(tbl.name,queryString)" class="btn btn-jdb-primary">Search</button></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-8">
                            <div class="panel panel-default">
                                <div class="panel-heading">Search results</div>
                                <div class="panel-body">
                                    <div> {%searchResult | json%} </div>
                                </div>
                            </div>

                            <!-- jQL command prompt -->
                            <div class="panel panel-default">
                                <div class="panel-heading">jEliDB command prompt</div>
                                <div class="panel-body">
                                    <div class="form-group"> <textarea class="form-control jdb-code" @keydown="commandPrompt($event)" rows="6" placeholder="type a jQL command and press Enter..."></textarea> </div>
                                    <div>
                                        <kbd>select</kbd> <kbd>insert</kbd> <kbd>update</kbd> <kbd>delete</kbd> <kbd>alter</kbd>
                                        <kbd>drop</kbd> <kbd>create</kbd> <kbd>truncate</kbd> <kbd>export</kbd> <kbd>import</kbd>
                                    </div>
                                    <div class="clearfix">
                                        <div class="pull-left"><span>{%queryMessage%}</span></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Tables display -->
                            <div class="panel panel-default">
                                <div class="panel-heading clearfix">Current database tables <button @click="syncTable(tbl.name)" class="btn btn-jdb-primary pull-right">Sync</button></div>
                                <div class="panel-body">
                                    <ul :for="tbl in tables" class="list-group">
                                        <li class="list-group-item">
                                            <div class="clearfix">
                                                <div class="pull-right">
                                                    <div class="btn btn-group">
                                                        <button @click="truncateTable(tbl.name)" class="btn btn-default">Truncate</button>
                                                        <button @click="dropTable(tbl.name)" class="btn btn-default">Drop</button>
                                                        <button @click="exportTable(tbl.name)" class="btn btn-default">Export</button>
                                                    </div>
                                                </div>
                                                <h4>{%tbl.name%}</h4>
                                            </div>
                                        </li>
                                        <li class="list-group-item">
                                            <table class="table table-bordered">
                                                <tr>
                                                    <td>Records:</td>
                                                    <td>{%tbl.records%}</td>
                                                </tr>
                                                <tr>
                                                    <td>Allowed mode:</td>
                                                    <td>{%tbl.allowedMode%}</td>
                                                </tr>
                                                <tr>
                                                    <td>Foreign key:</td>
                                                    <td>{%tbl.foreignKey%}</td>
                                                </tr>
                                                <tr>
                                                    <td>Primary key:</td>
                                                    <td>{%tbl.primaryKey%}</td>
                                                </tr>
                                            </table>
                                        </li>
                                    </ul>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </template>
    </app-root>
    <script src="../app.js" type="text/javascript"></script>
</body>

</html>
